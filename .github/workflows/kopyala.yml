name: kopyala

run-name: "kopya ${{ inputs.kim }} — ${{ inputs.url }}"

on:
  workflow_dispatch:
    inputs:
      url:
        description: Kopyalanacak adres
        required: true
      kim:
        description: Kopya kimliği (panel üretir)
        required: true
      sayfa:
        description: En fazla sayfa sayısı
        required: false
        default: "40"
      derinlik:
        description: Bağlantı derinliği
        required: false
        default: "6"

permissions:
  contents: write

concurrency:
  group: kopya-${{ inputs.kim }}
  cancel-in-progress: false

jobs:
  kopyala:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Siteyi kopyala
        env:
          HEDEF: ${{ inputs.url }}
          KIM: ${{ inputs.kim }}
          SAYFA: ${{ inputs.sayfa }}
          DERINLIK: ${{ inputs.derinlik }}
        run: |
          ruby site_kopyala.rb "$HEDEF" \
            -o "docs/kopyalar/$KIM" \
            -d "$DERINLIK" \
            -s "$SAYFA" \
            --varlik 4000

      - name: Pages için yolları düzelt
        env:
          KIM: ${{ inputs.kim }}
        run: ruby pages_hazirla.rb "docs/kopyalar/$KIM"

      - name: Kopya künyesi yaz
        env:
          HEDEF: ${{ inputs.url }}
          KIM: ${{ inputs.kim }}
        run: |
          ruby -rjson -e '
            yol = "docs/kopyalar/#{ENV["KIM"]}/.kopya.json"
            eski = File.file?(yol) ? (JSON.parse(File.read(yol)) rescue {}) : {}
            eski["url"] ||= ENV["HEDEF"]
            eski["kim"] = ENV["KIM"]
            File.write(yol, JSON.generate(eski))
          '

      - name: Commit ve push
        env:
          KIM: ${{ inputs.kim }}
          HEDEF: ${{ inputs.url }}
        run: |
          git config user.name "sitecopy-bot"
          git config user.email "sitecopy-bot@users.noreply.github.com"
          git add -A "docs/kopyalar/$KIM"
          if git diff --cached --quiet; then
            echo "değişiklik yok"
          else
            git commit -m "kopya: $HEDEF ($KIM)"
            git push
          fi
