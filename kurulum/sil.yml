name: sil

run-name: "sil — ${{ inputs.kim }}"

on:
  workflow_dispatch:
    inputs:
      kim:
        description: "Silinecek kopya kimliği (klasör adı)"
        required: true

permissions:
  contents: write

jobs:
  sil:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Kopyayı kaldır
        env:
          KIM: ${{ inputs.kim }}
        run: |
          git rm -r --ignore-unmatch "docs/kopyalar/$KIM"
          git config user.name "sitecopy-bot"
          git config user.email "sitecopy-bot@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "silinecek bir şey yok"
          else
            git commit -m "sil: $KIM"
            git push
          fi
