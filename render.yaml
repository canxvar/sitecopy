services:
  - type: web
    name: sitecopy
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    envVars:
      - key: KOPYA_MOD
        value: sunucu
      - key: KOPYA_ACMA
        value: "0"
      - key: KOPYA_KULLANICI
        value: admin
      - key: KOPYA_SIFRE
        generateValue: true
